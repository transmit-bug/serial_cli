name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-release:
    name: Verify Release Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Verify changelog generation
        run: |
          git-cliff --unreleased --output CHANGELOG.md.unreleased
          if [ -s CHANGELOG.md.unreleased ]; then
            echo "✓ Changelog generated successfully"
            cat CHANGELOG.md.unreleased
          else
            echo "⚠ No unreleased changes"
          fi

      - name: Verify version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$VERSION" = "$CARGO_VERSION" ]; then
            echo "✓ Versions match"
          else
            echo "⚠ Version mismatch (this may be expected)"
          fi

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: serial-cli-linux-x86_64
            binary_name: serial-cli
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: serial-cli-linux-aarch64
            binary_name: serial-cli
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: serial-cli-macos-x86_64
            binary_name: serial-cli
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: serial-cli-macos-arm64
            binary_name: serial-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: serial-cli-windows-x86_64.exe
            binary_name: serial-cli.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/serial-cli
          else
            strip target/${{ matrix.target }}/release/serial-cli
          fi

      - name: Build .deb package (Linux x86_64)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          # cargo-deb packs target/release by default; stage the cross-built binary there
          cp target/${{ matrix.target }}/release/serial-cli target/release/serial-cli
          cargo deb --no-build
          cp target/debian/*.deb target/${{ matrix.target }}/release/serial-cli-linux-x86_64.deb
          ls -lh target/${{ matrix.target }}/release/serial-cli-linux-x86_64.deb

      - name: Prepare artifacts
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp serial-cli.exe ${{ matrix.artifact_name }}
          else
            cp serial-cli ${{ matrix.artifact_name }}
          fi
          chmod +x ${{ matrix.artifact_name }} || true
          # Installer scripts ship once (from the ubuntu x86_64 job)
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cp ${{ github.workspace }}/scripts/install.sh serial-cli-install.sh
            cp ${{ github.workspace }}/scripts/install.ps1 serial-cli-install.ps1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  generate-sbom:
    name: Generate SBOM (Software Bill of Materials)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --output target/sbom --output-format json
          # Also generate XML format for broader tool compatibility
          cargo cyclonedx --output target/sbom-xml --output-format xml

      - name: Upload SBOM JSON
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/sbom/
          retention-days: 90

      - name: Upload SBOM XML
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-xml
          path: target/sbom-xml/
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [build, generate-sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git tag --sort=-v:refname | head -2 | tail -1)
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Copy SBOM to release directory
        run: |
          mkdir -p ./release-files
          # Copy all binary artifacts
          find ./artifacts -type f -not -name "*.sha256" -exec cp {} ./release-files/ \;
          # Copy SBOM files
          cp -r ./artifacts/sbom-cyclonedx/* ./release-files/ 2>/dev/null || true
          cp -r ./artifacts/sbom-cyclonedx-xml/* ./release-files/ 2>/dev/null || true

      - name: Create checksums
        run: |
          cd release-files
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release-files/*
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Serial CLI ${{ github.ref_name }}

            📦 **安装方式**

            ### 快速安装（脚本，自动检测系统）
            ```bash
            curl -fsSL https://github.com/transmit-bug/serial_cli/releases/latest/download/serial-cli-install.sh | sh
            # 可选：注册开机自启动（systemd / launchd / 计划任务）
            curl -fsSL https://github.com/transmit-bug/serial_cli/releases/latest/download/serial-cli-install.sh | sh -s -- --service
            ```
            Windows (PowerShell):
            ```powershell
            Invoke-WebRequest https://github.com/transmit-bug/serial_cli/releases/latest/download/serial-cli-install.ps1 -OutFile install.ps1
            .\install.ps1 -Service
            ```

            ### Linux (Debian/Ubuntu/树莓派)
            ```bash
            wget https://github.com/transmit-bug/serial_cli/releases/latest/download/serial-cli-linux-x86_64.deb
            sudo dpkg -i serial-cli-linux-x86_64.deb   # 或 sudo apt install ./serial-cli-linux-x86_64.deb
            # 开机自启守护进程（随包附 systemd unit）:
            sudo systemctl enable --now serial-cli
            ```

            ### Linux
            ```bash
            # 下载并安装
            wget https://github.com/transmit-bug/serial_cli/releases/latest/download/serial-cli-linux-x86_64
            chmod +x serial-cli-linux-x86_64
            sudo mv serial-cli-linux-x86_64 /usr/local/bin/serial-cli

            # 验证校验和
            sha256sum -c serial-cli-linux-x86_64.sha256
            ```

            ### macOS
            ```bash
            # 下载并安装
            curl -L https://github.com/transmit-bug/serial_cli/releases/latest/download/serial-cli-macos-arm64 -o serial-cli
            chmod +x serial-cli
            sudo mv serial-cli /usr/local/bin/

            # 验证校验和
            shasum -a 256 -c serial-cli-macos-arm64.sha256
            ```

            ### Windows
            ```powershell
            # 下载
            # https://github.com/transmit-bug/serial_cli/releases/latest/download/serial-cli-windows-x86_64.exe

            # 验证校验和
            certutil -hashfile serial-cli-windows-x86_64.exe SHA256
            ```

            ### Cargo
            ```bash
            cargo install serial-cli
            ```

            📋 **SBOM (Software Bill of Materials)**

            This release includes a CycloneDX SBOM in both JSON and XML formats.
            These files document all dependencies for security auditing and compliance.

            - `bom.json` — CycloneDX JSON format
            - `bom.xml` — CycloneDX XML format

            📚 **文档**: [USAGE.md](https://github.com/transmit-bug/serial_cli/blob/master/USAGE.md)

            🐛 **Bug报告**: [Issues](https://github.com/transmit-bug/serial_cli/issues)

            💬 **讨论**: [Discussions](https://github.com/transmit-bug/serial_cli/discussions)

            ---
            **完整变更日志**: https://github.com/transmit-bug/serial_cli/compare/${{ steps.prev-tag.outputs.tag }}...${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish

  update-packages:
    name: Update Package Managers
    needs: [build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Get release info
        id: release
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUM=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT

      - name: Calculate SHA256 checksums
        id: sha
        run: |
          curl -sL "https://github.com/transmit-bug/serial_cli/releases/download/${{ steps.release.outputs.version }}/serial-cli-linux-x86_64" -o serial-cli-linux
          curl -sL "https://github.com/transmit-bug/serial_cli/releases/download/${{ steps.release.outputs.version }}/serial-cli-windows-x86_64.exe" -o serial-cli.exe
          curl -sL "https://github.com/transmit-bug/serial_cli/releases/download/${{ steps.release.outputs.version }}/serial-cli-linux-x86_64.tar.gz" -o serial-cli.tar.gz || true
          echo "linux=$(sha256sum serial-cli-linux | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "windows=$(sha256sum serial-cli.exe | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "source=$(sha256sum serial-cli.tar.gz 2>/dev/null || echo 'manual')" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAP_REPO="https://github.com/transmit-bug/serial-cli-homebrew.git"
          TMP_DIR=$(mktemp -d)
          git clone "$TAP_REPO" "$TMP_DIR"
          cd "$TMP_DIR"
          FORMULA_FILE="Formula/serial-cli.rb"
          mkdir -p Formula
          if [ ! -f "$FORMULA_FILE" ]; then
            cp "$GITHUB_WORKSPACE/scripts/templates/homebrew.rb" "$FORMULA_FILE"
          fi
          sed -i "s/\${VERSION}/${{ steps.release.outputs.version }}/g" "$FORMULA_FILE"
          sed -i "s/\${SHA256}/${{ steps.sha.outputs.linux }}/g" "$FORMULA_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_FILE"
          git commit -m "Bump to ${{ steps.release.outputs.version }}"
          git push
          rm -rf "$TMP_DIR"

      - name: Update Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BUCKET_REPO="https://github.com/transmit-bug/serial-cli-scoop.git"
          TMP_DIR=$(mktemp -d)
          git clone "$BUCKET_REPO" "$TMP_DIR"
          cd "$TMP_DIR"
          mkdir -p bucket
          cp "$GITHUB_WORKSPACE/scripts/templates/scoop.json" "bucket/serial-cli.json"
          sed -i "s/\${VERSION_NUM}/${{ steps.release.outputs.version_num }}/g" "bucket/serial-cli.json"
          sed -i "s/\${VERSION}/${{ steps.release.outputs.version }}/g" "bucket/serial-cli.json"
          sed -i "s/\${SHA256}/${{ steps.sha.outputs.windows }}/g" "bucket/serial-cli.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bucket/serial-cli.json"
          git commit -m "Bump to ${{ steps.release.outputs.version_num }}"
          git push
          rm -rf "$TMP_DIR"

      - name: Generate AUR files
        run: |
          VERSION_NUM="${{ steps.release.outputs.version_num }}"
          SHA="${{ steps.sha.outputs.source }}"
          mkdir -p aur
          sed -e "s/\${VERSION_NUM}/$VERSION_NUM/g" -e "s/\${SHA256}/$SHA/g" \
            "$GITHUB_WORKSPACE/scripts/templates/PKGBUILD" > aur/PKGBUILD
          sed -e "s/\${VERSION_NUM}/$VERSION_NUM/g" -e "s/\${SHA256}/$SHA/g" \
            "$GITHUB_WORKSPACE/scripts/templates/.SRCINFO" > aur/.SRCINFO


      - name: Upload AUR files
        uses: actions/upload-artifact@v4
        with:
          name: aur-files
          path: aur/
