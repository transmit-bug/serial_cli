# Cross-compilation config (used by the `cross` CLI for the ARM64 CI job).
# The default cross-rs aarch64 image does not ship libudev for the target,
# which makes libudev-sys fail pkg-config. Install it in the container before
# building.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y libudev-dev:arm64 pkg-config",
]
